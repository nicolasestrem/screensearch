[package]
name = "screensearch"
description = "ScreenSearch V2c — Tauri 2 desktop shell + composition root. See specs/03 §2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "screensearch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
rusqlite.workspace = true

[dependencies]
# `tray-icon` unlocks the native Tauri tray + menu APIs (0.3.2 PR3, #56/#57 — `03 §7d`);
# `protocol-asset` serves the stored frame images.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
# Single-instance guard: a second launch focuses the running window and exits, so two copies
# never share the app-data dir (racing the SQLite DB + hf-hub model-cache locks). See specs/07 #26.
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# Opens external URLs in the OS default browser. Tauri v2 does not open plain
# `target="_blank"` anchors, so the NavRail version link + the report/answer markdown
# links route through this (0.3.1 D4, #57). Scoped by the `opener:allow-open-url` capability.
tauri-plugin-opener = "2"
# Auto-update (0.3.2 PR2, #69; `03 §11b`). Checks a minisign-signed `latest.json` on
# GitHub Releases; the public key + endpoint live in `tauri.conf.json` (`plugins.updater`).
# Driven entirely from Rust (`src/update.rs`) via our own typed commands, so the UI needs
# no `updater:*` capability and no `@tauri-apps/plugin-updater` package (typed IPC only, D1).
tauri-plugin-updater = "2"
# Launch-at-login for the "Run at startup" setting (0.3.2 PR3, #56; `03 §7d`, default OFF).
# Rust-driven (registered/queried from `src/lib.rs`), so no JS capability is required.
tauri-plugin-autostart = "2"
# Composes the per-state tray icon variants (capturing / paused / error) at runtime by
# overlaying a status dot on the bundled 32×32 base (0.3.2 PR3). Also decodes the stored
# WebP capture in the live e2e_capture test.
image.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true
sha2.workspace = true
reqwest.workspace = true
regex = "1"

traits.workspace = true
store.workspace = true
kernel.workspace = true
sessions.workspace = true
capture.workspace = true
ocr.workspace = true
uia.workspace = true
embeddings.workspace = true
inference.workspace = true
sysmon.workspace = true
# The opt-in local HTTP API (0.3.0 PR7, `03 §7c`). Off by default; the server is
# constructed only when enabled. axum compiles into the app here (and in `crates/api`).
api.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Credentials", "Win32_Storage_FileSystem"] }
