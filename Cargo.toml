# Workspace root — ScreenSearch V2c
# Layout & dependency rule: see specs/03_MASTER_PRODUCTION_SPEC.md §2.
# `kernel` and module crates depend on `traits` (contracts), never on each
# other's concrete impls. `src-tauri` is the composition root that wires impls.

[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/traits",
    "crates/kernel",
    "crates/store",
    "crates/capture",
    "crates/ocr",
    "crates/uia",
    "crates/embeddings",
    "crates/inference",
    "crates/textfilter",
    "crates/sysmon",
    "crates/doctor",
    "crates/api",
    "crates/mcp",
    "crates/harness",
    "crates/sessions",
]

[workspace.package]
version = "0.4.2"
edition = "2021"
# libsqlite3-sys 0.38.1 uses cfg_select!, stabilized in Rust 1.95.
rust-version = "1.95"
license = "MIT"
authors = ["Nicolas Estrem <nicolasestrem@users.noreply.github.com>"]
repository = "https://github.com/nicolasestrem/screensearch-v2c"

# Centralized dependency versions — crates reference these with
# `dep = { workspace = true }` so versions never drift across the workspace.
[workspace.dependencies]
# core async + error handling
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"

# serialization + typed IPC
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
ts-rs = "10"
# TOML for the dev-only segmentation harness (0.4.0 PR2): the hand-label files and the
# D7 recognition-taxonomy data file (the format 03 §7e proposes the shipped taxonomy will
# use in PR4). Compiled only into crates/harness, never the app or the MCP binary.
toml = "0.9"

# HTTP API (opt-in, all IPv4 interfaces, bearer auth — 03 §7c). axum is the one new
# dependency in this arc; it reuses the hyper 1.x / tower 0.5 / http 1.x stack already
# in the tree (via reqwest + tauri), so only axum/axum-core/matchit compile fresh. It is
# compiled **only** into `crates/api` + `src-tauri` (the app), never the MCP binary.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
# hyper 1.x server plumbing for the API's bounded accept loop + request-header deadline
# (PR #122 review amendment, `03 §7c`): the HTTP/1 connection builder, TokioIo/
# TokioExecutor/TokioTimer, and the tower→hyper service bridge. Every feature listed is
# already enabled transitively by axum's server path for this workspace, so no new crate
# compiles; `http2`/`server-auto` stay off — the listener is HTTP/1 across the board, so
# the header deadline covers every request.
hyper-util = { version = "0.1.20", default-features = false, features = [
    "http1",
    "server",
    "service",
    "tokio",
] }
# CSPRNG for the API bearer token; already in the tree (rustls), so no new compilation.
getrandom = "0.3"
# stream combinators for the SSE `/v1/ask` bridge + the streamed `/v1/export`; already
# present transitively (reqwest/hyper), so a direct dep adds no new compilation.
futures-util = "0.3"

# HTTP: the OpenAI-compatible llama.cpp sidecar client (localhost, plain HTTP) and
# runtime downloads (GitHub release zip + HuggingFace GGUF). rustls so we never need
# a system OpenSSL on Windows; `stream` for SSE answer streaming + large downloads.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
# dev-only: a localhost mock of the sidecar's OpenAI HTTP API for client tests.
wiremock = "0.6"
tempfile = "3"

# Runtime model + binary downloads (Rust-only, no Python — 01 §5, MODEL_REGISTRY §4).
# hf-hub pulls GGUF/mmproj from HuggingFace; zip unpacks the prebuilt llama.cpp Vulkan
# release; base64 encodes captured frames into the vision lane's image data URLs.
hf-hub = { version = "0.4", default-features = false, features = [
    "tokio",
    "rustls-tls",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
# Verifies a parallel-downloaded model blob against HuggingFace's LFS sha256
# (the `X-Linked-Etag` OID) when the CDN advertises it. Already in the tree
# transitively (hf-hub/rustls), so a direct dep adds no new compilation.
sha2 = "0.10"

# data spine: SQLite (bundled, FTS5) + sqlite-vec (vec0) + stable content hashing.
# `bundled` compiles a recent SQLite so we never depend on a system libsqlite3 on
# Windows; that amalgamation enables FTS5 (and FTS3/RTREE) by default, so the
# porter-tokenized full-text index (03 §4) needs no extra feature. sqlite-vec
# provides the `vec0` virtual table for cosine KNN; blake3 is the chunk
# content-hash change-detector for `embeddings.content_hash`.
rusqlite = { version = "0.40", features = ["bundled"] }
# Pinned to the latest stable (0.1.9). The 0.1.10-alpha line ships a broken
# amalgamation (references sqlite-vec-diskann.c, which isn't in the package).
sqlite-vec = "0.1.9"
blake3 = "1"

# imaging (capture/embeddings share the same image type). `webp` enables the lossless
# WebP encoder (via image-webp, already in the tree) used by the capture storage path —
# crisper than JPEG on text and no new C dependency.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# in-process embeddings: fastembed (ONNX via `ort`, no Python — 01 §5, 03 §3).
# 5.17 ships the `EmbeddingGemma300MQ` text variant (768-dim, quantized), the only
# embedding lane (MODEL_REGISTRY §3). `default-features = false` drops the `image-models`
# default feature (0.3.0 PR4 removed the image lane), keeping only the ORT + hf-hub
# download stack fastembed needs; a prebuilt ONNX Runtime is pulled at build time and
# models download from HuggingFace on first use.
fastembed = { version = "5.17", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }

# Windows-native APIs (P2: WGC capture, WinRT Media.Ocr, foreground/lock probes).
# Version only here; each crate enables the feature modules it needs, under a
# `[target.'cfg(windows)'.dependencies]` block (Windows-only by design, 04 guardrails).
windows = "0.62"

# logging / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# internal crates
traits = { path = "crates/traits" }
kernel = { path = "crates/kernel" }
store = { path = "crates/store" }
capture = { path = "crates/capture" }
ocr = { path = "crates/ocr" }
uia = { path = "crates/uia" }
embeddings = { path = "crates/embeddings" }
inference = { path = "crates/inference" }
textfilter = { path = "crates/textfilter" }
sysmon = { path = "crates/sysmon" }
api = { path = "crates/api" }
sessions = { path = "crates/sessions" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
