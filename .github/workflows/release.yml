name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to use in artifact names
        required: true
        default: '0.4.35'
        type: string
      publish_release:
        description: Create a draft GitHub release
        required: true
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          }
          else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: screensearch-ui/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sidecar/requirements.txt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Build React UI
        run: |
          cd screensearch-ui
          npm ci
          npm run build
        shell: pwsh

      - name: Build Rust release binary
        run: cargo build --release --locked
        shell: pwsh

      - name: Build quality AI sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt
          python sidecar/build.py
        shell: pwsh

      - name: Smoke test packaged PP-OCRv5
        shell: pwsh
        run: |
          $env:SCREENSEARCH_AI_SIDECAR_TOKEN = "release-smoke-test"
          $stdout = Join-Path $env:RUNNER_TEMP "sidecar-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "sidecar-stderr.log"
          $sidecar = Start-Process `
            -FilePath "sidecar/dist/screensearch-ai-sidecar/screensearch-ai-sidecar.exe" `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          $headers = @{ Authorization = "Bearer $env:SCREENSEARCH_AI_SIDECAR_TOKEN" }

          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                Invoke-RestMethod -Uri "http://127.0.0.1:3132/health" -Headers $headers | Out-Null
                $healthy = $true
                break
              }
              catch {
                if ($sidecar.HasExited) {
                  throw "Packaged quality sidecar exited before becoming healthy."
                }
              }
            }
            if (-not $healthy) {
              throw "Packaged quality sidecar did not become healthy within 60 seconds."
            }

            $prepareBody = @{
              components = @("ocr")
              ocr_language = "en"
            } | ConvertTo-Json
            Invoke-RestMethod `
              -Method Post `
              -Uri "http://127.0.0.1:3132/v1/models/prepare" `
              -Headers $headers `
              -ContentType "application/json" `
              -Body $prepareBody | Out-Null

            $ready = $false
            for ($attempt = 0; $attempt -lt 600; $attempt++) {
              Start-Sleep -Seconds 1
              $status = Invoke-RestMethod `
                -Uri "http://127.0.0.1:3132/v1/models/status" `
                -Headers $headers
              if ($status.state -eq "ready") {
                $ready = $true
                break
              }
              if ($status.state -eq "error") {
                throw "PP-OCRv5 preparation failed: $($status.error)"
              }
            }
            if (-not $ready) {
              throw "PP-OCRv5 preparation did not finish within 10 minutes."
            }

            Add-Type -AssemblyName System.Drawing
            $imagePath = Join-Path $env:RUNNER_TEMP "ocr-smoke-test.png"
            $bitmap = New-Object System.Drawing.Bitmap 640, 160
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.Clear([System.Drawing.Color]::White)
              $font = New-Object System.Drawing.Font "Arial", 32
              $graphics.DrawString(
                "ScreenSearch OCR smoke test",
                $font,
                [System.Drawing.Brushes]::Black,
                20,
                45
              )
              $bitmap.Save($imagePath, [System.Drawing.Imaging.ImageFormat]::Png)
            }
            finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }

            $response = Invoke-RestMethod `
              -Method Post `
              -Uri "http://127.0.0.1:3132/v1/ocr" `
              -Headers $headers `
              -Form @{ image = (Get-Item $imagePath); language = "en" }
            if ($response.provider -ne "ppocr-v5" -or $response.lines.Count -eq 0) {
              throw "Packaged PP-OCRv5 returned no recognized lines."
            }
          }
          finally {
            if (-not $sidecar.HasExited) {
              Stop-Process -Id $sidecar.Id -Force
            }
            Write-Host "--- quality sidecar stdout ---"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "--- quality sidecar stderr ---"
            if (Test-Path $stderr) { Get-Content $stderr }
          }

      - name: Download VC++ Redistributable
        run: |
          Write-Host "Downloading Visual C++ 2015-2022 Redistributable..."
          $vcRedistUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          Invoke-WebRequest -Uri $vcRedistUrl -OutFile "installer/resources/vc_redist.x64.exe" -MaximumRetryCount 3
          
          # Verify download (should be ~24-25MB)
          $size = (Get-Item "installer/resources/vc_redist.x64.exe").Length / 1MB
          Write-Host "VC++ Redistributable downloaded: $([math]::Round($size, 1)) MB"
          if ($size -lt 20) {
            Write-Error "VC++ Redistributable too small: $size MB (expected >20 MB)"
            exit 1
          }
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Build Installer
        run: |
          $version = $env:RELEASE_VERSION
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\screensearch.iss

          Move-Item "target\release\installers\ScreenSearch-v$version-Setup.exe" `
                    "target\release\installers\ScreenSearch-v$version-Setup-Quality.exe" -Force
        shell: pwsh

      - name: Create Portable ZIP
        run: |
          $version = $env:RELEASE_VERSION
          Remove-Item target/release/bin -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path target/release/bin
          Copy-Item sidecar/dist/screensearch-ai-sidecar target/release/bin/ -Recurse
          Compress-Archive -Path target/release/screensearch.exe, target/release/bin, config.toml, LICENSE, README.md `
                           -DestinationPath "target/release/installers/ScreenSearch-v$version-Portable.zip" `
                           -Force
        shell: pwsh

      - name: Generate checksums
        run: |
          cd target/release/installers
          $files = Get-ChildItem -Filter "ScreenSearch-v*"

          $checksums = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.Name -Algorithm SHA256).Hash.ToLower()
            $checksums += "$hash  $($file.Name)"
          }

          $checksums | Out-File -FilePath "checksums.txt" -Encoding UTF8

          Write-Host "Generated checksums:"
          Get-Content checksums.txt
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            target/release/installers/ScreenSearch-v*
            target/release/installers/checksums.txt

  create-release:
    name: Create GitHub Release
    needs: build-release
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Extract version from tag
        id: get_version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Changelog
        id: changelog
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          # Extract version section from CHANGELOG.md
          CHANGELOG_SECTION=$(awk '
            /^## \['"$VERSION"'\]/ { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$CHANGELOG_SECTION" ]; then
            CHANGELOG_SECTION="No changelog entries for this version."
          fi

          # Update terminology
          CHANGELOG_SECTION=$(echo "$CHANGELOG_SECTION" | sed 's/ONNX embedding model/AI RAG Search Model/g; s/ONNX model/AI RAG Search Model/g')

          # Use heredoc for multiline output (GitHub Actions requirement)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          files: |
            artifacts/ScreenSearch-v*.exe
            artifacts/ScreenSearch-v*.zip
            artifacts/checksums.txt
          body: |
            # ScreenSearch v${{ steps.get_version.outputs.VERSION }}

            Your screen history, searchable and automated - Windows OCR + REST API + AI + RAG

            ## Download Options

            **Quality Installer**
            - Includes the managed local PP-OCRv5/Qwen inference sidecar
            - Prepares selected models from Settings with **Download / verify**
            - Supports CPU and compatible GPU acceleration

            **Portable ZIP**
            - Extract and run, no installation
            - Includes the same local quality sidecar

            ---

            ## What's New

            ${{ steps.changelog.outputs.content }}

            ---

            ## Installation

            ### Quick Start

            1. Download the Quality Installer above
            2. Run the installer executable
            3. **Windows SmartScreen Warning**: Click "More info" → "Run anyway"
               - This is expected for self-signed applications
            4. Launch ScreenSearch from Start Menu
            5. Access web interface at `http://localhost:3131`

            ### System Requirements

            - Windows 10/11 (64-bit)
            - Up to 5 GB disk space for optional quality models
            - Windows OCR Language Pack for fallback OCR

            ---

            ## Verification

            Verify download integrity with SHA256 checksums:

            ```bash
            sha256sum ScreenSearch-v${{ steps.get_version.outputs.VERSION }}-Setup-Quality.exe
            ```

            Compare output with `checksums.txt` in release assets.

            ---

            ## Important Notes

            **Windows SmartScreen Warning**

            This release is self-signed and will trigger SmartScreen warnings. This is expected behavior for applications without an EV certificate.

            To install:
            1. Click "More info" when SmartScreen appears
            2. Click "Run anyway"
            3. Proceed with installation

            Verify authenticity by checking SHA256 checksums or building from source.

            ---

            **Documentation**: [Project Docs](https://github.com/nicolasestrem/screensearch/tree/main/docs) | [API Reference](https://github.com/nicolasestrem/screensearch/blob/main/docs/api-reference.md)
            **Website**: [screensearch.app](https://screensearch.app)
            **License**: MIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
