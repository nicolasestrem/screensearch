name: Claude Code Review

# On-demand only — there are no automatic PR reviews (cost). Trigger a review by commenting
# `/claude-review` on a PR (repo owner/member/collaborator only), or run this workflow manually
# from the Actions tab with a PR number. The trigger deliberately does not contain `@claude`, so
# it never also fires `claude.yml`. Comment-triggered runs use this file from the default branch.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

jobs:
  claude-review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/claude-review') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # Trusted checkout only: this job has secrets, so it must never check out PR code (a fork
      # PR could plant `.claude/settings.json` hooks or a CLAUDE.md). The review reads the PR
      # diff through the GitHub API instead (CodeQL actions/untrusted-checkout).
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ env.PR_NUMBER }}'
          claude_args: '--model claude-sonnet-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
