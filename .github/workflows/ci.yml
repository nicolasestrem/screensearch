name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # --- Frontend first: src-tauri's generate_context! embeds ui/dist, which
      #     is git-ignored, so the UI must be built before any cargo step. ---
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI install
        working-directory: ui
        run: npm ci
      - name: UI lint (Rules-of-Hooks gate at error level)
        working-directory: ui
        run: npm run lint
      - name: UI build (creates ui/dist)
        working-directory: ui
        run: npm run build

      # --- Rust workspace ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Reject vulnerable quinn-proto lockfile entries
        run: node scripts/check-quinn-security.mjs
      # src-tauri declares the MCP binary as a bundle.externalBin; tauri-build resolves it on
      # EVERY compile of the app crate (not just at bundle time), so it must be staged before
      # any `cargo` step touches the workspace, or the build fails (0.3.0 PR8).
      - name: stage MCP sidecar (externalBin)
        run: node scripts/stage-mcp.mjs
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (-D warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --locked --workspace
      - name: test
        run: cargo test --locked --workspace

      # --- Typed-IPC contract guard: cargo test regenerates the ts-rs bindings;
      #     if they differ from what's committed, the contract drifted. ---
      - name: verify ts-rs bindings are committed & current
        shell: bash
        run: git diff --exit-code -- ui/src/bindings

      - name: environment doctor (informational)
        run: cargo run --locked -p doctor

# NOTE: the NSIS installer ships via `tauri build` (`bundle.targets=["nsis"]`, v0.1.0; Inno/MSI/
# portable ZIP dropped — see specs/07 #26). A CI artifact + code-signing job is still TODO. CI gates
# fmt, clippy, build, test, UI build/lint, and binding freshness.
