[package]
name = "api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The opt-in local HTTP API (0.3.0 PR7, `03 §7c`). Depends on `traits` only (the
# module-dependency rule, `03 §2`): the composition root implements `ApiHost` over the
# concrete store/kernel and wires the server in, so this crate never links an impl.
[dependencies]
traits = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
# Match the router's exact templates for default-deny route/method authorization.
axum = { workspace = true, features = ["matched-path"] }
# The bounded accept loop + request-header deadline (PR #122 review amendment): the
# HTTP/1 connection builder, TokioIo/TokioExecutor/TokioTimer, and the tower→hyper
# service bridge. Already compiled for the tree via axum's server path.
hyper-util = { workspace = true }
getrandom = { workspace = true }
futures-util = { workspace = true }
# `net` for the TcpListener bind; `fs`/`io-util` for the export-to-file path (PR7 §7c).
tokio = { workspace = true, features = ["net", "fs", "io-util"] }

[dev-dependencies]
# Integration tests spin the real server over a populated in-memory store (via the
# store + kernel crates — tests only, not a runtime dependency) and drive it with reqwest.
store = { workspace = true }
kernel = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
# Fixture-only direct SQLite handle for `examples/memory_consumer_fixture.rs`: the
# labeled unsupported `reuse_timestamp` identity-conflict injection and the
# `VACUUM INTO` snapshot/restore of the disposable fixture DB. Never used by the API
# crate itself; the same fixture-only direct-SQL class as
# `crates/store/tests/history_allocator.rs` (which uses the store crate's rusqlite).
rusqlite = { workspace = true }

# Exclusive Windows bind prevents another interface-specific listener sharing the API port.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Networking_WinSock"] }
