[package]
name = "harness"
description = "Dev-only, read-only segmentation validation harness (0.4.0 PR2). Not shipped: workspace crates are never bundled by the NSIS installer. See docs/0.4.0.md §3 PR2, specs/03 §7e."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "harness"
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/main.rs"

# PR4 adds the harness's first internal dependency: the pure `sessions` crate, solely for
# the `--algo shipped` D9 adapter. It still never links store/kernel or enters the installer.
#
# 0.4.5 P4 adds the eval runner's HTTP client (reqwest/tokio/futures-util) and chrono for run
# ids. Deliberately absent: `store`, `kernel`, `inference`, `api`, `mcp`, `graph` — linking
# `store` would open the database read-write and destroy the read-only guarantee (`03 §2`).
[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures-util.workspace = true
sessions.workspace = true
rusqlite.workspace = true
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
