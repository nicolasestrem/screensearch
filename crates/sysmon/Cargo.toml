[package]
name = "sysmon"
description = "Windows-native system-pressure probe: whole-machine CPU via GetSystemTimes + GPU via PDH GPU-Engine counters, implementing traits::PressureProbe for the smart enrichment throttle. See specs/03 §5/§8, docs/0.2.0.md (former PR5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
traits.workspace = true
tracing.workspace = true

# Windows-only by design (04 guardrails). CPU busy% via GetSystemTimes
# (sysinfoapi.h → SystemInformation, the same module capture/idle.rs uses), GPU
# utilization via PDH (\GPU Engine(*)\Utilization Percentage) and host memory via
# GlobalMemoryStatusEx (SystemInformation) for physical usage plus
# GetPerformanceInfo (ProcessStatus/PSAPI) for host-wide commit charge: the
# MEMORYSTATUSEX page-file fields are process-scoped, so they cannot stand in for the
# host's commit numbers. PDH is the only genuinely new feature module; ProcessStatus
# supplies just GetPerformanceInfo.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
] }
