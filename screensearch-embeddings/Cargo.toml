[package]
name = "screensearch-embeddings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local ML embedding generation for ScreenSearch RAG"

[dependencies]
# Async runtime
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# In-process embeddings + reranking via ONNX Runtime (no Python sidecar).
# `ort-load-dynamic` loads `onnxruntime.dll` at runtime instead of statically
# linking it: a statically-linked ONNX Runtime fails to link under this repo's
# forced static-CRT + lld config (unresolved UCRT symbols), and dynamic loading
# is the right model for a portable Windows binary that ships the DLL alongside
# the exe. `hf-hub-native-tls` keeps first-run model download/caching.
fastembed = { version = "5.17", default-features = false, features = [
    "ort-load-dynamic",
    "hf-hub-native-tls",
] }

# Content hashing for chunk de-duplication
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

[lib]
name = "screensearch_embeddings"
path = "src/lib.rs"
