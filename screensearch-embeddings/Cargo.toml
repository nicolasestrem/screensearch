[package]
name = "screensearch-embeddings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local ML embedding generation for ScreenSearch RAG"

[dependencies]
# Async runtime
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# In-process embeddings + reranking via ONNX Runtime (no Python sidecar).
# Pulls in `ort` (ONNX Runtime 2.x) and `hf-hub` transitively; downloads and
# caches models from HuggingFace on first use.
fastembed = "5.17"

# Content hashing for chunk de-duplication
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

[lib]
name = "screensearch_embeddings"
path = "src/lib.rs"
